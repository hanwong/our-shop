# CI Workflow
#
# Runs the verification scripts already defined in package.json against every
# pull request targeting main, and against every push to main. This workflow
# introduces no new verification tooling and changes no existing script — it
# only moves the execution from a developer's machine to CI (SPEC-CI-001).
#
# SPEC-CI-001 M4 — trivial touch to trigger AC-CI-004's cancellation check
# (a superseding push while a run is in progress cancels the earlier one).
#
# Triggers:
#   - pull_request (main): opened / synchronize / reopened
#   - push (main): keeps main's status continuously known
#   - workflow_dispatch: manual re-run (same convention as label-sync.yml)
#
# Scope: CI only. Deployment (CD) is deliberately out of scope until a hosting
# target is chosen — see .moai/specs/SPEC-CI-001/spec.md §3.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only checks out code. It writes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A pull request only cares about the result for its latest commit, so
  # superseded runs are cancelled. A push to main must keep a verification
  # record per commit, so those runs are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # This name is the contract surface that a branch protection rule
    # references as a required status check (REQ-CI-015). Renaming it breaks
    # any protection rule already pointing at it.
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # PLACEHOLDER — not a real credential, and not a secret (REQ-CI-011,
      # REQ-CI-012). It points at loopback and no database of that name is
      # ever reachable from a runner.
      #
      # It is load-bearing rather than defensive: `prisma validate` fails with
      # P1012 "Environment variable not found: DATABASE_URL" when the variable
      # is absent, and with "You must provide a nonempty URL" when it is empty,
      # because prisma/schema.prisma declares url = env("DATABASE_URL").
      # A clean CI checkout has no .env (it is gitignored), so without this the
      # prisma:validate step could not pass. `prisma generate` does not need it.
      #
      # Nothing in CI opens a database connection: the test suite mocks the
      # Prisma seam (@/lib/db), and the auth tests set their own JWT/OAuth
      # environment variables, so no real secret needs to reach this workflow.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/our_shop_ci?schema=public"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version, shared with local
          # development via `nvm use` (REQ-CI-013).
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        # src/ and tests/ import types from @prisma/client, which only exist
        # after generation, so this is a precondition for typecheck and test
        # rather than an optional step (REQ-CI-008).
        id: prisma_generate
        run: npm run prisma:generate

      # The four verification steps below each run regardless of whether the
      # others failed, so one push reports every failure at once instead of
      # revealing them one round trip at a time (REQ-CI-007).
      #
      # !cancelled() alone would be wrong: it would also run these after a
      # broken setup, burying the real error under four "cannot find module"
      # failures. Gating on prisma_generate — the last step of the setup chain,
      # so its success implies checkout, setup-node and npm ci all succeeded —
      # keeps the verification steps skipped when setup breaks (REQ-CI-009).
      - name: Lint
        if: ${{ !cancelled() && steps.prisma_generate.conclusion == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.prisma_generate.conclusion == 'success' }}
        run: npm run typecheck

      - name: Validate Prisma schema
        if: ${{ !cancelled() && steps.prisma_generate.conclusion == 'success' }}
        run: npm run prisma:validate

      - name: Test with coverage
        # vitest exits non-zero when a test fails OR when coverage falls below
        # the thresholds in vitest.config.ts, so this one step enforces both
        # (REQ-CI-006, REQ-CI-010).
        if: ${{ !cancelled() && steps.prisma_generate.conclusion == 'success' }}
        run: npm run test:coverage

      - name: Upload coverage report
        # Convenience only — no REQ/AC depends on this step's success
        # (acceptance.md §4 DoD note). Uploaded even on a failing run so a
        # failure's coverage state is inspectable, never on a broken setup.
        if: ${{ !cancelled() && steps.prisma_generate.conclusion == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
